x-app-environment: &app-environment
  - APP_ENV=demo
  - APP_DEBUG=true
  - DEMO_DEBUG=true
  - APP_KEY=base64:xc0gNsjvO2D6bmaV5SNcBqiakMqMnOP2bJabqDd81oA=
  - APP_URL=http://localhost:8000
  - DB_CONNECTION=mysql
  - DB_HOST=mysql
  - DB_PORT=3306
  - DB_DATABASE=finaegis
  - DB_USERNAME=finaegis
  - DB_PASSWORD=secret
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - BROADCAST_DRIVER=log
  - CACHE_DRIVER=file
  - CACHE_STORE=file
  - QUEUE_CONNECTION=redis
  - SESSION_DRIVER=file
  - MAIL_MAILER=smtp
  - MAIL_HOST=mailpit
  - MAIL_PORT=1025
  - METRICS_TOKEN=demo-metrics-token

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment

  queue:
    image: proyectopayproof-app:latest
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=180", "--sleep=1", "--queue=default,events,ledger,transactions,transfers,liquidity_pools"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: finaegis
      MYSQL_USER: finaegis
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/alerting_rules.yml:/etc/prometheus/rules/alerting_rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.16
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_UPDATE_CHECK_ENABLED=false
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards/core-banking-kpis.json:/var/lib/grafana/dashboards/core-banking-kpis.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

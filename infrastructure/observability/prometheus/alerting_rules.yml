# FinAegis Alerting Rules
# Aligned with the metrics actually exported by PrometheusExporter
# (http_requests_by_status_total, http_request_duration_seconds_sum/_count,
#  finaegis_transactions_total, infra_*).
# See infrastructure/observability/prometheus/prometheus.yml

groups:
  # Critical alerts - require immediate response
  - name: finaegis_critical
    interval: 30s
    rules:
      - alert: TransactionFailureRateHigh
        expr: sum(rate(finaegis_transactions_total{status="failed"}[5m])) / sum(rate(finaegis_transactions_total[5m])) > 0.2
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High rate of failed business transactions"
          description: "Transaction failure rate is {{ $value | humanizePercentage }} (threshold: 20%)"

      - alert: NoTransactionsAtAll
        expr: sum(rate(finaegis_transactions_total[10m])) == 0
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "No business transactions processed in the last 10 minutes"
          description: "The core stopped processing money-moving operations."

      - alert: QueueBacklogCritical
        expr: infra_queue_size > 1000
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Queue backlog exceeds 1,000 jobs"
          description: "Current queue depth: {{ $value | humanize }} jobs"

  # Warning alerts - require attention
  - name: finaegis_warning
    interval: 1m
    rules:
      - alert: APIErrorRateHigh
        expr: sum(rate(http_requests_by_status_total{status=~"5.."}[5m])) / sum(rate(http_requests_by_status_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "API error rate exceeds 1%"
          description: "Current error rate: {{ $value | humanizePercentage }}"

      - alert: AverageLatencyHigh
        expr: sum(rate(http_request_duration_seconds_sum[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Average API latency exceeds 1 second"
          description: "Current average latency: {{ $value | humanizeDuration }}"

      - alert: FailedJobsIncreasing
        expr: increase(infra_queue_failed_total[1h]) > 5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "More than 5 failed queue jobs in the last hour"
          description: "Failed jobs increase: {{ $value | humanize }}"
